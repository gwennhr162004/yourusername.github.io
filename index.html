<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise 💙</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:linear-gradient(to bottom,#58a9ff,#b8ddff);
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

/* CARD */

.card{
width:100%;
max-width:420px;
background:rgba(255,255,255,0.9);
border-radius:30px;
padding:25px;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,0.15);
}

/* TITLE */

h1{
color:#2b65c7;
margin-bottom:20px;
font-size:30px;
}

/* CAKE */

.cake-area{
position:relative;
width:280px;
height:300px;
margin:auto;
animation:bounce 2s infinite;
}

/* BOTTOM LAYER */

.cake-bottom{
position:absolute;
bottom:0;
width:280px;
height:120px;
background:#9dd8ff;
border-radius:25px;
}

/* TOP LAYER */

.cake-top{
position:absolute;
bottom:95px;
left:40px;
width:200px;
height:90px;
background:#9dd8ff;
border-radius:22px;
}

/* WHITE CREAM */

.cake-bottom::before,
.cake-top::before{
content:'';
position:absolute;
top:0;
left:0;
width:100%;
height:35px;
background:white;
border-radius:20px;
}

/* CREAM DRIPS */

.cake-bottom::after{
content:'';
position:absolute;
top:20px;
left:0;
width:100%;
height:40px;
background:
radial-gradient(circle at 20px 0,#fff 18px,transparent 19px),
radial-gradient(circle at 60px 0,#fff 18px,transparent 19px),
radial-gradient(circle at 100px 0,#fff 18px,transparent 19px),
radial-gradient(circle at 140px 0,#fff 18px,transparent 19px),
radial-gradient(circle at 180px 0,#fff 18px,transparent 19px),
radial-gradient(circle at 220px 0,#fff 18px,transparent 19px),
radial-gradient(circle at 260px 0,#fff 18px,transparent 19px);
}

.cake-top::after{
content:'';
position:absolute;
top:18px;
left:0;
width:100%;
height:35px;
background:
radial-gradient(circle at 15px 0,#fff 15px,transparent 16px),
radial-gradient(circle at 50px 0,#fff 15px,transparent 16px),
radial-gradient(circle at 85px 0,#fff 15px,transparent 16px),
radial-gradient(circle at 120px 0,#fff 15px,transparent 16px),
radial-gradient(circle at 155px 0,#fff 15px,transparent 16px),
radial-gradient(circle at 190px 0,#fff 15px,transparent 16px);
}

/* SPRINKLES */

.sprinkle{
position:absolute;
width:10px;
height:4px;
border-radius:10px;
}

.s1{background:#ff69b4;top:40px;left:30px;}
.s2{background:#ffd966;top:60px;left:80px;}
.s3{background:#7ee0ff;top:50px;left:140px;}
.s4{background:#c084fc;top:70px;left:170px;}

.s5{background:#ff69b4;top:60px;left:40px;}
.s6{background:#ffd966;top:90px;left:100px;}
.s7{background:#7ee0ff;top:70px;left:180px;}
.s8{background:#c084fc;top:95px;left:240px;}

/* CANDLES */

.candles{
position:absolute;
top:20px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:12px;
z-index:5;
}

.candle{
width:14px;
height:60px;
background:#ffb6d9;
border-radius:10px;
position:relative;
}

.flame{
position:absolute;
top:-20px;
left:50%;
transform:translateX(-50%);
width:14px;
height:20px;
background:gold;
border-radius:50%;
box-shadow:0 0 15px orange;
animation:flicker .8s infinite alternate;
}

/* FLAME OUT */

.off{
opacity:0;
transform:translateX(-50%) translateY(-12px);
transition:1s;
}

/* BUTTON */

button{
margin-top:20px;
border:none;
background:#4d95ff;
color:white;
padding:14px 28px;
font-size:18px;
border-radius:999px;
cursor:pointer;
font-weight:700;
box-shadow:0 10px 18px rgba(0,0,0,0.12);
}

/* TEXT */

#msg{
margin-top:20px;
font-size:28px;
font-weight:700;
color:#2b65c7;
opacity:0;
transform:scale(0.8);
transition:1s;
}

.show{
opacity:1 !important;
transform:scale(1) !important;
}

/* ANIMATION */

@keyframes bounce{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(-8px);
}
}

@keyframes flicker{
from{
transform:translateX(-50%) scale(1);
}
to{
transform:translateX(-50%) scale(1.15);
}
}

</style>
</head>

<body>

<div class="card">

<h1>Happy Birthday Bebduu 🤭💙</h1>

<div class="cake-area">

<!-- CANDLES -->

<div class="candles">

<div class="candle"><div class="flame"></div></div>
<div class="candle"><div class="flame"></div></div>
<div class="candle"><div class="flame"></div></div>
<div class="candle"><div class="flame"></div></div>
<div class="candle"><div class="flame"></div></div>
<div class="candle"><div class="flame"></div></div>
<div class="candle"><div class="flame"></div></div>

</div>

<!-- TOP CAKE -->

<div class="cake-top">

<div class="sprinkle s1"></div>
<div class="sprinkle s2"></div>
<div class="sprinkle s3"></div>
<div class="sprinkle s4"></div>

</div>

<!-- BOTTOM CAKE -->

<div class="cake-bottom">

<div class="sprinkle s5"></div>
<div class="sprinkle s6"></div>
<div class="sprinkle s7"></div>
<div class="sprinkle s8"></div>

</div>

</div>

<button onclick="blowCandles()">
BLOW 🎂
</button>

<div id="msg">
Happy Birthday My Bebduu 🤭❤️
</div>

</div>

<script>

function blowCandles(){

document.querySelectorAll('.flame')
.forEach(flame=>{

flame.classList.add('off');

});

const msg=document.getElementById('msg');

msg.classList.add('show');

}

</script>

</body>
</html>
